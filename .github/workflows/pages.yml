name: Deploy the add-in to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the add-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v7
        with:
          repository: eylulg/ui
          path: ui-src
      - name: Build the design system
        # Same as ci.yml: package.json depends on file:../ui.
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build
      - name: Install against the built library
        run: npm install --no-audit --no-fund --install-links
      - name: Build the add-in
        run: npm run build -w addin
        env:
          # Repository variable, set to the deployed Worker URL, for example
          # https://plain-language.<account>.workers.dev
          VITE_REWRITE_API_URL: ${{ vars.REWRITE_API_URL }}
      - name: Publish the manifest next to the add-in
        run: cp addin/manifest.xml addin/dist/manifest.xml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: addin/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
