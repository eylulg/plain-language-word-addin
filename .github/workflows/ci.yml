name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: eylulg/ui
          path: ui-src
      - name: Build the design system
        run: npm ci && npm run build
        working-directory: ui-src
      - name: Point the dependency at the checkout
        run: npm pkg set dependencies.@eylulg/ui=file:./ui-src --workspaces=false && npm pkg set dependencies.@eylulg/ui=file:../ui-src -w addin
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Validate the add-in manifest
        run: npx office-addin-manifest validate addin/manifest.xml
        continue-on-error: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
