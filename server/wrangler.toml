# Cloudflare Workers config. Deploy with `npx wrangler deploy`.
# Without ANTHROPIC_API_KEY the Worker serves fixture rewrites and never calls Claude.
# To use Claude: `npx wrangler secret put ANTHROPIC_API_KEY`.
name = "plain-language"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
REWRITE_MODEL = "claude-sonnet-5-5"
# Origins only, no path. The add-in on GitHub Pages sends https://eylulg.github.io.
ALLOWED_ORIGINS = "https://eylulg.github.io"
